<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-label="Mapa missio 9 Cowabunga">
<defs><pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#9cff4a" stroke-opacity=".12"/></pattern><style>text{font-family:Arial,sans-serif;font-weight:700}.t{font-size:18px}.s{font-size:13px}.zoneH{fill:#2fb8ff;fill-opacity:.14;stroke:#2fb8ff;stroke-width:4;stroke-dasharray:12 8}.obj{fill:#9d65ff;stroke:#fff;stroke-width:4}.boss{fill:#ff67b8;stroke:#fff;stroke-width:4}.slash{fill:#43d66f;stroke:#fff;stroke-width:4}.plat{fill:#263b50;stroke:#9cff4a;stroke-width:3}.danger{fill:#ff3b35;fill-opacity:.12;stroke:#ff3b35;stroke-width:3;stroke-dasharray:10 8}</style></defs>
<rect width="720" height="720" fill="#07120c"/><rect x="40" y="40" width="640" height="640" fill="#14091f" stroke="#43d66f" stroke-width="4"/><rect x="40" y="40" width="640" height="640" fill="url(#grid)"/>
