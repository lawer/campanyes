<circle cx="360" cy="80" r="42" class="obj"/><text x="360" y="86" fill="#fff" class="s" text-anchor="middle">Portal Terra</text><circle cx="360" cy="80" r="100" class="danger"/><text x="360" y="188" fill="#ff9b92" class="s" text-anchor="middle">zona perillosa des de R3</text>
<circle cx="360" cy="330" r="34" class="boss"/><text x="360" y="336" fill="#fff" class="s" text-anchor="middle">Kraang</text>
<circle cx="360" cy="185" r="30" class="slash"/><text x="360" y="230" fill="#fff" class="s" text-anchor="middle">Slash entra R2</text>
<rect x="145" y="300" width="105" height="65" rx="10" class="plat"/><rect x="470" y="300" width="105" height="65" rx="10" class="plat"/><rect x="300" y="470" width="120" height="65" rx="10" class="plat"/>
