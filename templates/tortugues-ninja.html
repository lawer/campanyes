<!DOCTYPE html>
<html lang="ca-valencia">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$title$</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;500;600;700;800;900&family=Roboto+Slab:wght@400;600;700&display=swap');
:root{
  --bg:#07120c;--bg2:#102318;--panel:#13281c;--panel2:#1a3424;
  --shell:#43d66f;--shell2:#0b8f43;--mutagen:#9cff4a;--pizza:#ffb329;
  --mask:#f04d31;--leo:#2fb8ff;--don:#9d65ff;--raph:#ff3b35;--mikey:#ff8b1f;
  --kraang:#ff67b8;--foot:#1d1825;--text:#f2ffe9;--soft:#d5e8c8;--muted:#9eb99b;
  --line:rgba(156,255,74,.28);--shadow:rgba(0,0,0,.55);
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;font-size:16px;line-height:1.7}
body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-2;background:radial-gradient(circle at 15% 8%,rgba(156,255,74,.22),transparent 28%),radial-gradient(circle at 88% 10%,rgba(255,103,184,.18),transparent 28%),radial-gradient(circle at 50% 100%,rgba(255,179,41,.16),transparent 34%),linear-gradient(180deg,#07120c 0%,#102318 44%,#07120c 100%)}
body:after{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.24;background:radial-gradient(circle,rgba(156,255,74,.28) 1px,transparent 1.6px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:14px 14px,76px 76px;mix-blend-mode:screen}
.wrap{max-width:1080px;margin:0 auto;padding:28px 18px 56px}p{margin:.45rem 0 0}a{color:var(--mutagen)}code{background:rgba(156,255,74,.12);border:1px solid rgba(156,255,74,.22);border-radius:4px;padding:1px 5px;color:#ddffc9}
.cover{position:relative;overflow:hidden;min-height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:72px 28px;border:4px solid #101a12;border-radius:4px;background:radial-gradient(circle at 50% 35%,rgba(156,255,74,.30),transparent 25%),radial-gradient(circle at 76% 18%,rgba(255,103,184,.20),transparent 25%),linear-gradient(145deg,rgba(16,44,25,.96),rgba(5,14,10,.98) 55%,rgba(38,18,8,.94));box-shadow:0 28px 80px var(--shadow),inset 0 0 0 2px rgba(255,255,255,.06),inset 0 0 90px rgba(156,255,74,.10)}
.cover:before{content:'COWABUNGA  ·  MUTAGEN  ·  PIZZA  ·  CLAN DEL PEU  ·  KRAANG';position:absolute;left:0;right:0;bottom:0;padding:9px 16px;background:repeating-linear-gradient(135deg,#111 0 12px,#ffb329 12px 24px);color:#07120c;font-family:Bangers,Inter,sans-serif;font-size:20px;letter-spacing:2px;text-shadow:0 1px 0 rgba(255,255,255,.45);white-space:nowrap;overflow:hidden}.cover:after{content:'NYC';position:absolute;top:8px;right:18px;color:rgba(255,255,255,.08);font-family:Bangers,sans-serif;font-size:112px;letter-spacing:7px;line-height:1;transform:rotate(-5deg)}
.brand-logo{display:block;width:min(760px,92%);height:auto;margin:0 auto 18px;filter:drop-shadow(6px 6px 0 #050505) drop-shadow(0 0 24px rgba(156,255,74,.42))}.label,.smallcap,.rank,.mtype,.mbar,.pill,.tag{font-family:Bangers,Inter,sans-serif;text-transform:uppercase;letter-spacing:2px}.label{color:var(--pizza);font-size:22px;text-shadow:3px 3px 0 #0b0b0b,0 0 20px rgba(255,179,41,.45)}.label p,.subtitle p,.intro p,.smallcap p,.rank p,.name p,.desc p{margin:0}
h1{font-family:Bangers,Inter,sans-serif;font-size:clamp(62px,13vw,142px);line-height:.82;margin:18px 0 12px;color:var(--mutagen);letter-spacing:3px;text-transform:uppercase;-webkit-text-stroke:2px #0b0b0b;text-shadow:5px 5px 0 #0b0b0b,9px 9px 0 var(--shell2),0 0 38px rgba(156,255,74,.48)}.subtitle{font-weight:900;color:#fff;font-size:clamp(16px,2.7vw,24px);text-transform:uppercase;letter-spacing:2px;text-shadow:3px 3px 0 #0b0b0b}.intro{max-width:780px;margin-top:24px;color:var(--soft);font-family:Roboto Slab,Georgia,serif;font-size:18px;background:rgba(4,10,7,.70);border:2px solid rgba(156,255,74,.28);padding:18px 22px;box-shadow:8px 8px 0 rgba(0,0,0,.38)}
.tags{margin-top:24px}.tags p,.stats p{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0}.tag,.pill{display:inline-flex;align-items:center;border:2px solid rgba(16,16,16,.85);background:var(--shell2);color:#fff;border-radius:999px;padding:5px 11px;font-size:18px;line-height:1;box-shadow:3px 3px 0 #080808}.tag:nth-child(2n),.pill:nth-child(2n){background:var(--pizza);color:#211300}.tag:nth-child(3n),.pill:nth-child(3n){background:var(--don);color:#fff}
.sh{text-align:center;margin:54px 0 20px}.sh h2{font-family:Bangers,Inter,sans-serif;font-size:clamp(36px,7vw,70px);letter-spacing:2px;line-height:.95;color:#fff;text-transform:uppercase;text-shadow:4px 4px 0 #0b0b0b,0 0 20px rgba(156,255,74,.35)}.smallcap{color:var(--pizza);font-size:19px}.rule{border:0;height:4px;max-width:600px;margin:0 auto 28px;background:linear-gradient(90deg,transparent,var(--leo),var(--raph),var(--mikey),var(--don),transparent);box-shadow:0 0 18px rgba(156,255,74,.45)}
.grid,.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card,.panel,.mission,.villain,.ending{border:2px solid var(--line);background:linear-gradient(160deg,rgba(26,52,36,.96),rgba(7,18,12,.98));box-shadow:9px 9px 0 rgba(0,0,0,.30),0 18px 48px rgba(0,0,0,.26)}.card{position:relative;padding:22px;border-top:6px solid var(--shell)}.card:after{content:'';position:absolute;inset:auto 0 0;height:5px;background:linear-gradient(90deg,var(--leo),var(--raph),var(--mikey),var(--don));opacity:.95}.rank{color:var(--pizza);font-size:17px}.name{font-family:Bangers,Inter,sans-serif;color:#fff;font-size:38px;letter-spacing:1.5px;line-height:1;margin:4px 0 10px;text-shadow:3px 3px 0 #090909}.desc{color:var(--muted);font-family:Roboto Slab,Georgia,serif;font-size:15px}.stats{margin-top:16px}.stats p{justify-content:flex-start}
.art{display:block;width:100%;height:clamp(230px,36vw,390px);object-fit:cover;margin:22px 0;border:2px solid rgba(156,255,74,.28);background:#07120c;box-shadow:8px 8px 0 rgba(0,0,0,.32);filter:saturate(1.08) contrast(1.08)}.art.compact{height:clamp(190px,28vw,320px);margin:14px 0}.art-card{padding:0;overflow:hidden}.art-card p{margin:0}.art-card img{display:block;width:100%}.logo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}.logo-tile{display:flex;align-items:center;justify-content:center;min-height:150px;padding:18px;border:2px solid rgba(156,255,74,.24);background:radial-gradient(circle at 50% 30%,rgba(156,255,74,.12),transparent 56%),rgba(4,12,7,.72);box-shadow:6px 6px 0 rgba(0,0,0,.28)}.logo-tile img{display:block;max-width:100%;max-height:116px;object-fit:contain;filter:drop-shadow(4px 4px 0 #050505)}.scene-art{margin:22px 0;border:2px solid rgba(156,255,74,.28);background:#07120c;box-shadow:8px 8px 0 rgba(0,0,0,.32);overflow:hidden}.scene-art figure{margin:0}.scene-art figcaption{padding:8px 12px;font-family:Bangers,Inter,sans-serif;text-transform:uppercase;letter-spacing:2px;font-size:18px;color:var(--pizza);background:rgba(4,10,7,.82)}.scene-art img{display:block;width:100%;max-height:430px;object-fit:cover;filter:saturate(1.05) contrast(1.08)}.scene-art.setup img{max-height:none;object-fit:contain;background:#07120c}.portrait{display:block;width:100%;height:230px;object-fit:cover;object-position:top center;margin:4px 0 14px;border:2px solid rgba(156,255,74,.30);background:#07120c;filter:saturate(1.08) contrast(1.06)}.box p:has(.portrait){margin:0}
.panel{padding:26px;margin:26px 0}.panel h3,.rtitle{font-family:Bangers,Inter,sans-serif;color:#fff;text-transform:uppercase;letter-spacing:2px;font-size:34px;line-height:1;margin:0 0 16px;text-shadow:3px 3px 0 #070707}.panel h3:before,.rtitle:before{content:'▰ ';color:var(--mutagen)}.box{border:2px solid rgba(156,255,74,.22);background:rgba(5,17,10,.62);padding:16px}.box h4{font-family:Bangers,Inter,sans-serif;color:var(--pizza);font-size:24px;letter-spacing:1.5px;margin:0 0 8px;text-transform:uppercase;text-shadow:2px 2px 0 #070707}.box ul,.rbox ul{margin:0;padding:0;list-style:none}.box li,.rbox li{position:relative;padding:7px 0 7px 22px;color:var(--soft);border-bottom:1px solid rgba(156,255,74,.12)}.box li:last-child,.rbox li:last-child{border-bottom:0}.box li:before,.rbox li:before{content:'>';position:absolute;left:0;color:var(--mutagen);font-weight:900}.box strong,.rbox strong{color:#fff}.scale{border-left:6px solid var(--leo)!important}.print{border-left:6px solid var(--mikey)!important}.ai{border-left:6px solid var(--kraang)!important}
.chapter{margin:60px 0}.banner{position:relative;overflow:hidden;padding:30px 26px;margin-bottom:22px;border:2px solid rgba(156,255,74,.32);background:radial-gradient(circle at 88% 30%,rgba(156,255,74,.16),transparent 36%),linear-gradient(135deg,rgba(18,60,28,.9),rgba(5,14,10,.66))}.banner:after{content:'SEWER';position:absolute;right:16px;bottom:-22px;font-family:Bangers,sans-serif;font-size:118px;line-height:1;color:rgba(156,255,74,.10);letter-spacing:5px}.banner.red{border-color:rgba(255,59,53,.42);background:radial-gradient(circle at 88% 30%,rgba(255,59,53,.18),transparent 36%),linear-gradient(135deg,rgba(58,14,12,.88),rgba(5,14,10,.66))}.banner.red:after{content:'FOOT';color:rgba(255,59,53,.10)}.banner.violet{border-color:rgba(255,103,184,.42);background:radial-gradient(circle at 88% 30%,rgba(255,103,184,.22),transparent 36%),linear-gradient(135deg,rgba(55,21,65,.88),rgba(5,14,10,.72))}.banner.violet:after{content:'KRAANG';color:rgba(255,103,184,.12)}.ctitle{font-family:Bangers,Inter,sans-serif;color:#fff;font-size:clamp(42px,8vw,78px);line-height:.95;letter-spacing:2px;text-shadow:4px 4px 0 #090909}
.mission{margin:24px 0 34px;overflow:hidden}.mhead{display:flex;background:linear-gradient(90deg,rgba(156,255,74,.18),rgba(255,179,41,.10))}.mbar{width:54px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;padding:12px 0;background:linear-gradient(180deg,var(--shell2),rgba(255,179,41,.85));color:#07120c;font-size:18px;border-right:2px solid rgba(0,0,0,.42)}.mhc{flex:1;padding:18px 20px;border-bottom:1px solid rgba(156,255,74,.18)}.mtype{color:var(--pizza);font-size:17px}.mtitle{font-family:Bangers,Inter,sans-serif;color:#fff;font-size:40px;line-height:1;letter-spacing:1px;text-shadow:3px 3px 0 #070707}.mbody{padding:22px}.quote{position:relative;margin:0 0 18px;padding:16px 18px 16px 22px;color:#fff;background:linear-gradient(90deg,rgba(255,179,41,.18),rgba(156,255,74,.07));border-left:6px solid var(--pizza);font-family:Roboto Slab,Georgia,serif;font-size:16px}.quote cite{display:block;margin-top:10px;color:var(--mutagen);font-family:Bangers,Inter,sans-serif;font-style:normal;font-size:18px;letter-spacing:2px;text-transform:uppercase}.rbox{border:2px solid rgba(255,179,41,.36);background:rgba(4,12,7,.80);padding:18px;margin-top:16px}.rbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.terrain{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}.terrain .box{border-left:6px solid var(--shell)}
.maptop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:9px 14px;background:rgba(4,12,7,.86);border-top:1px solid rgba(156,255,74,.22);border-bottom:1px solid rgba(156,255,74,.22);color:var(--pizza);font-family:Bangers,Inter,sans-serif;text-transform:uppercase;letter-spacing:2px;font-size:17px}.map{display:block;width:100%;background:#07120c;border-bottom:1px solid rgba(156,255,74,.22)}.mission p:has(.map),.panel p:has(.map){margin:0}
.villain{position:relative;overflow:hidden;padding:30px;margin:44px 0;border-color:rgba(255,103,184,.44);background:radial-gradient(circle at 85% 18%,rgba(255,103,184,.25),transparent 34%),linear-gradient(135deg,rgba(48,16,60,.84),rgba(5,14,10,.98))}.villain:after{content:'SHREDDER';position:absolute;right:16px;top:6px;color:rgba(255,255,255,.07);font-family:Bangers,sans-serif;font-size:82px;letter-spacing:5px}.villain .name{font-size:58px;color:#fff;text-shadow:4px 4px 0 #090909,0 0 28px rgba(255,103,184,.65)}.villain p{max-width:780px;color:var(--soft)}.ending{text-align:center;padding:34px;margin:42px 0;background:radial-gradient(circle at 50% 0%,rgba(156,255,74,.18),transparent 42%),linear-gradient(160deg,rgba(18,60,28,.9),rgba(5,14,10,.98))}.ending h3{font-family:Bangers,Inter,sans-serif;font-size:50px;letter-spacing:2px;line-height:1;color:#fff;text-shadow:4px 4px 0 #090909,0 0 22px rgba(156,255,74,.45)}
@media print{body{background:#fff;color:#111}.wrap{max-width:none}.cover,.card,.panel,.mission,.villain,.ending{box-shadow:none;break-inside:avoid}.cover{break-after:page}}
@media(max-width:680px){.wrap{padding:12px}.cover{min-height:430px;padding:48px 16px 54px}.cover:after{font-size:62px}.brand-logo{width:96%;margin-bottom:12px}.intro{font-size:16px;padding:14px}.mbar{width:40px}.mbody{padding:16px}.panel{padding:18px}.mission{margin-left:-4px;margin-right:-4px}.mtitle{font-size:33px}h1{-webkit-text-stroke:1px #0b0b0b}}
</style>
</head>
<body><main class="wrap">
$body$
</main></body></html>
