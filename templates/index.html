<!DOCTYPE html>
<html lang="ca-valencia">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campanyes OPR Quest</title>
<style>
body{margin:0;background:#10100d;color:#eadfca;font-family:Georgia,serif;line-height:1.65}
.wrap{max-width:960px;margin:0 auto;padding:42px 20px}
h1{font-size:clamp(34px,7vw,64px);line-height:1.05;margin:0 0 14px;color:#d8b85a}
.wrap>h2{margin:34px 0 -10px;color:#eadfca;font-size:22px;font-weight:400;letter-spacing:1.5px;text-transform:uppercase}
.campaign-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:30px}
.campaign-card{border:1px solid rgba(216,184,90,.35);background:linear-gradient(145deg,rgba(45,107,83,.25),rgba(0,0,0,.25));padding:22px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.campaign-card h2{margin:0 0 10px;color:#70c79a;font-size:26px;line-height:1.2}
a{color:#d8b85a}
.button{display:inline-block;margin-top:12px;padding:9px 14px;border:1px solid rgba(216,184,90,.45);text-decoration:none;text-transform:uppercase;letter-spacing:1.5px;font-size:12px;background:rgba(216,184,90,.08)}
</style>
</head>
<body><main class="wrap">
$body$
</main></body></html>
