<!DOCTYPE html>
<html lang="ca-valencia">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Pelegrinatge de la Lluna Mossegada - Campanya AoFQ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Noto+Serif+TC:wght@500;700;900&display=swap');
:root{
  --jade:#70c79a;--jade2:#2d6b53;--jade3:#143a31;
  --red:#9f3028;--red2:#d35a45;--lacquer:#39110e;
  --gold:#d8b85a;--gold2:#8d6f2e;--oldgold:#b08a35;
  --ink:#080706;--ink2:#12100c;--paper:#e0cf9f;--dim:#ab9973;--text:#dfd0b2;
  --blue:#628fc8;--violet:#9b6bd6;--shadow:rgba(0,0,0,.42);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:#080706;
  background-image:
    radial-gradient(circle at 50% -8%,rgba(216,184,90,.13) 0 9%,transparent 24%),
    radial-gradient(circle at 13% 10%,rgba(159,48,40,.20),transparent 30%),
    radial-gradient(circle at 88% 18%,rgba(112,199,154,.11),transparent 33%),
    radial-gradient(circle at 70% 92%,rgba(155,107,214,.10),transparent 34%),
    linear-gradient(90deg,rgba(216,184,90,.025) 1px,transparent 1px),
    linear-gradient(180deg,#080706 0%,#15110c 48%,#080706 100%);
  background-size:auto,auto,auto,auto,44px 44px,auto;
  color:var(--text);font-family:'EB Garamond',Georgia,serif;font-size:17px;line-height:1.75;
}
body:before,body:after{content:'';position:fixed;top:0;bottom:0;width:9px;z-index:2;pointer-events:none;background:linear-gradient(180deg,transparent,var(--gold2),transparent)}
body:before{left:0}body:after{right:0}
.wrap{max-width:1000px;margin:0 auto;padding:20px}
.cover{
  text-align:center;padding:82px 28px 54px;border:1px solid rgba(216,184,90,.38);
  background:
    radial-gradient(circle at 50% 25%,rgba(216,184,90,.13) 0 11%,transparent 25%),
    radial-gradient(circle at 50% 24%,rgba(216,184,90,.33) 0 4%,transparent 4.4%),
    linear-gradient(135deg,rgba(20,58,49,.38),rgba(8,7,6,.94) 46%,rgba(57,17,14,.56));
  position:relative;overflow:hidden;box-shadow:0 20px 60px var(--shadow),inset 0 0 80px rgba(0,0,0,.35);
}
.cover:before{content:'';position:absolute;inset:14px;border:1px solid rgba(216,184,90,.18);pointer-events:none}
.cover:after{content:'月';position:absolute;right:28px;top:18px;font-family:'Noto Serif TC',serif;font-size:92px;line-height:1;color:rgba(216,184,90,.075);text-shadow:0 0 22px rgba(216,184,90,.12);pointer-events:none}
.label,.smallcap{font-family:Cinzel,serif;text-transform:uppercase;letter-spacing:4px;font-size:10px;color:var(--gold2)}
.label:before,.label:after{content:'  -  ';color:var(--red2)}
h1{font-family:'Noto Serif TC',Cinzel,serif;font-size:clamp(31px,7vw,62px);line-height:1.08;color:var(--gold);font-weight:900;text-shadow:0 0 28px rgba(216,184,90,.35),0 3px 0 #000;margin:18px 0 12px;letter-spacing:.5px}
.subtitle{font-family:Cinzel,serif;letter-spacing:2px;color:var(--jade);font-size:14px;margin-bottom:28px;text-transform:uppercase}
.intro{max-width:740px;margin:0 auto;color:var(--paper);font-style:italic;font-size:18px;text-shadow:0 1px 0 #000}
.tags{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:28px}.tag{border:1px solid rgba(216,184,90,.44);color:var(--gold);font-family:Cinzel,serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:5px 12px;background:linear-gradient(180deg,rgba(57,17,14,.55),rgba(0,0,0,.22));box-shadow:inset 0 0 18px rgba(216,184,90,.04)}
.sh{text-align:center;margin:52px 0 20px}.sh h2{font-family:'Noto Serif TC',Cinzel,serif;color:var(--gold);font-size:clamp(20px,4vw,32px);font-weight:900}.rule{border:0;height:1px;max-width:460px;margin:0 auto 30px;background:linear-gradient(90deg,transparent,var(--red2),var(--gold),var(--red2),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:17px}.card,.panel,.mission,.villain,.ending{background:linear-gradient(160deg,rgba(26,22,16,.96),rgba(11,9,7,.98));border:1px solid rgba(216,184,90,.24);box-shadow:0 16px 38px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.025)}.card{padding:20px;position:relative;overflow:hidden}.card:before{content:'';position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--jade),var(--gold),var(--red2),transparent)}
.rank{font-family:Cinzel,serif;text-transform:uppercase;letter-spacing:3px;font-size:9px;color:var(--oldgold)}.name{font-family:'Noto Serif TC',Cinzel,serif;color:var(--gold);font-weight:900;font-size:22px;margin:4px 0 10px}.desc{color:var(--dim);font-style:italic;font-size:15.5px}.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.pill{font-family:Cinzel,serif;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;border:1px solid rgba(216,184,90,.24);color:var(--paper);background:rgba(216,184,90,.05)}
.portrait{height:210px;margin:-2px -2px 16px;border:1px solid rgba(216,184,90,.22);background:#080706;overflow:hidden;position:relative}.portrait:after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 15%,transparent 35%,rgba(8,7,6,.22) 74%,rgba(8,7,6,.52));pointer-events:none}.portrait figure{height:100%;margin:0}.portrait figcaption{display:none}.portrait img{width:100%;height:100%;object-fit:cover;display:block;filter:sepia(.22) saturate(.9) contrast(1.08)}.portrait.contain img{object-fit:contain;background:linear-gradient(135deg,#100d09,#1a140d)}.caption{font-family:Cinzel,serif;text-transform:uppercase;letter-spacing:2px;font-size:8px;color:rgba(216,184,90,.55);margin-top:-9px;margin-bottom:10px}.caption p,.rank p,.name p,.desc p,.label p,.subtitle p,.intro p{margin:0}.tags p,.stats p{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:0}.stats p{justify-content:flex-start;gap:6px}.art-panel{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:18px;align-items:center}.art-panel figure{margin:0}.art-panel figcaption{display:none}.art-panel img{width:100%;max-height:320px;object-fit:cover;border:1px solid rgba(216,184,90,.28);box-shadow:0 18px 42px rgba(0,0,0,.28);filter:sepia(.18) saturate(.86) contrast(1.04)}.scene-art{margin:22px 0;border:1px solid rgba(216,184,90,.28);background:#080706;box-shadow:0 18px 42px rgba(0,0,0,.28);overflow:hidden}.scene-art figure{margin:0}.scene-art figcaption{padding:7px 12px;font-family:Cinzel,serif;text-transform:uppercase;letter-spacing:2px;font-size:8px;color:rgba(216,184,90,.58);background:rgba(0,0,0,.35)}.scene-art img{display:block;width:100%;max-height:430px;object-fit:cover;filter:sepia(.12) saturate(.92) contrast(1.04)}.scene-art.setup img{max-height:none;object-fit:contain;background:#0b0a08}.credits li a{color:var(--jade);text-decoration:none}.credits li a:hover{text-decoration:underline}
.panel{padding:24px;margin:24px 0}.panel h3,.rtitle{font-family:Cinzel,serif;color:var(--gold);text-transform:uppercase;letter-spacing:3px;font-size:12px;margin-bottom:13px}.panel h3:before,.rtitle:before{content:'✦ ';color:var(--red2)}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px}.box{border:1px solid rgba(216,184,90,.14);padding:13px;background:linear-gradient(160deg,rgba(0,0,0,.25),rgba(20,58,49,.07))}.box h4{font-family:Cinzel,serif;color:var(--oldgold);font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:7px}.box ul,.rlist{list-style:none}.box li,.rlist li{position:relative;padding-left:15px;color:var(--dim);font-size:14px;border-bottom:1px solid rgba(216,184,90,.06);padding-top:4px;padding-bottom:4px}.box li:before,.rlist li:before{content:'›';position:absolute;left:0;color:var(--jade);font-size:15px;top:2px}.box strong,.rlist strong{color:var(--paper)}
.chapter{margin:54px 0}.banner{padding:26px 24px;border:1px solid rgba(112,199,154,.30);background:radial-gradient(circle at 88% 30%,rgba(112,199,154,.13),transparent 36%),linear-gradient(135deg,rgba(20,58,49,.55),rgba(0,0,0,.22));margin-bottom:20px;position:relative;overflow:hidden}.banner:after{content:'灯';position:absolute;right:18px;bottom:-18px;font-family:'Noto Serif TC',serif;font-size:90px;color:rgba(112,199,154,.055)}.banner.red{border-color:rgba(211,90,69,.34);background:radial-gradient(circle at 88% 30%,rgba(211,90,69,.13),transparent 36%),linear-gradient(135deg,rgba(57,17,14,.78),rgba(0,0,0,.2))}.banner.red:after{content:'鬼';color:rgba(211,90,69,.06)}.banner.violet{border-color:rgba(155,107,214,.36);background:radial-gradient(circle at 88% 30%,rgba(155,107,214,.15),transparent 36%),linear-gradient(135deg,rgba(42,26,61,.78),rgba(0,0,0,.22))}.banner.violet:after{content:'門';color:rgba(155,107,214,.07)}.ctitle{font-family:'Noto Serif TC',Cinzel,serif;color:var(--gold);font-size:30px;font-weight:900}.lore{color:var(--dim);font-style:italic;margin-top:8px;max-width:780px}
.mission{margin:22px 0 32px;overflow:hidden}.mhead{display:flex;background:linear-gradient(90deg,rgba(57,17,14,.45),transparent)}.mbar{width:48px;background:linear-gradient(180deg,rgba(159,48,40,.55),rgba(20,58,49,.28));color:var(--gold);font-family:Cinzel,serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center;padding:10px 0;border-right:1px solid rgba(216,184,90,.16)}.mhc{flex:1;padding:17px;border-bottom:1px solid rgba(216,184,90,.11)}.mtype{font-family:Cinzel,serif;color:var(--oldgold);font-size:9px;letter-spacing:3px;text-transform:uppercase}.mtitle{font-family:'Noto Serif TC',Cinzel,serif;color:var(--gold);font-weight:900;font-size:23px}.maptop,.mapleg{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(20,58,49,.13));padding:8px 12px;border-top:1px solid rgba(216,184,90,.10);border-bottom:1px solid rgba(216,184,90,.10);font-family:Cinzel,serif;color:var(--oldgold);font-size:9px;letter-spacing:2px;text-transform:uppercase}.mapleg{justify-content:flex-start}.li{display:inline-flex;align-items:center;gap:5px}.sw{width:12px;height:12px;border:1px solid;display:inline-block;box-shadow:0 0 8px rgba(216,184,90,.12)}.map{display:block;width:100%;background:#0b0a08;filter:saturate(.93) contrast(1.05)}
.mbody{padding:20px 22px}.quote{border-left:3px solid var(--red2);background:linear-gradient(90deg,rgba(159,48,40,.12),rgba(216,184,90,.035));padding:13px 15px;color:var(--paper);font-style:italic;margin-bottom:15px}.quote cite{display:block;margin-top:8px;font-family:Cinzel,serif;color:var(--oldgold);font-size:9px;letter-spacing:2px;text-transform:uppercase;font-style:normal}.rbox{border:1px solid rgba(216,184,90,.20);background:rgba(0,0,0,.27);padding:15px;margin-top:15px}.rbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.terrain{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-top:10px}.terrain .box{border-left:3px solid var(--jade2)}.scale{border-left:3px solid var(--blue)!important}.print{border-left:3px solid var(--red2)!important}.ai{border-left:3px solid var(--gold)!important}
.villain{padding:28px;margin:38px 0;background:radial-gradient(circle at 85% 20%,rgba(155,107,214,.20),transparent 34%),linear-gradient(135deg,rgba(57,17,14,.55),#0d0b10);border-color:rgba(155,107,214,.36);position:relative;overflow:hidden}.villain:after{content:'鬼';position:absolute;right:22px;top:2px;font-family:'Noto Serif TC',serif;font-size:120px;color:rgba(155,107,214,.055)}.villain .name{font-size:32px;color:#c69cff;text-shadow:0 0 26px rgba(155,107,214,.35)}.ending{text-align:center;padding:34px;margin:38px 0;background:radial-gradient(circle at 50% 0%,rgba(216,184,90,.11),transparent 44%),linear-gradient(160deg,rgba(20,58,49,.28),rgba(11,9,7,.98))}.ending h3{font-family:'Noto Serif TC',Cinzel,serif;color:var(--gold);font-size:28px;margin-bottom:12px}footer{text-align:center;color:rgba(216,184,90,.38);font-family:Cinzel,serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;padding:30px}
@media print{body{background:#0b0a08}.wrap{max-width:none}.mission,.panel,.card,.villain,.ending{break-inside:avoid}.cover{break-after:page}.map{max-height:72vh}}
@media(max-width:760px){.art-panel{grid-template-columns:1fr}.art-panel img{max-height:260px}.portrait{height:185px}}
@media(max-width:640px){.wrap{padding:10px}.cover{padding:48px 14px 36px}.cover:after{font-size:64px;right:12px}.mbar{width:36px}.mbody{padding:14px}.maptop span:last-child{display:none}body:before,body:after{display:none}}
</style>
</head>
<body><div class="wrap">
$body$
</div></body></html>
