<!DOCTYPE html>
<html lang="ca-valencia">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Llums en la Foscor - Arc 1 - Campanya AoFQ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=Roboto+Slab:wght@400;600;700&display=swap');
:root{
  --bg:#05060d;--bg2:#0b1020;--panel:#121827;--panel2:#171f33;
  --red:#ff2b3d;--red2:#9f1525;--cyan:#32d8ff;--blue:#405cff;
  --amber:#ffd166;--green:#62e6a5;--text:#eef3ff;--muted:#aab4c9;
  --soft:#d7def2;--line:rgba(120,150,210,.28);--shadow:rgba(0,0,0,.55);
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;font-size:16px;line-height:1.7}
body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-2;background:radial-gradient(circle at 50% -10%,rgba(255,43,61,.28),transparent 32%),radial-gradient(circle at 86% 12%,rgba(50,216,255,.18),transparent 32%),linear-gradient(180deg,#05060d 0%,#0b1020 46%,#05060d 100%)}
body:after{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.26;background:linear-gradient(transparent 95%,rgba(50,216,255,.22) 96%),linear-gradient(90deg,transparent 95%,rgba(255,43,61,.16) 96%);background-size:44px 44px}
.wrap{max-width:1080px;margin:0 auto;padding:28px 18px 56px}
p{margin:.45rem 0 0}a{color:var(--cyan)}code{background:rgba(50,216,255,.1);border:1px solid rgba(50,216,255,.18);border-radius:4px;padding:1px 5px;color:#c9f6ff}
.cover{position:relative;overflow:hidden;min-height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 28px;border:1px solid rgba(255,43,61,.45);background:radial-gradient(circle at 50% 35%,rgba(255,43,61,.20),transparent 26%),linear-gradient(145deg,rgba(16,23,45,.92),rgba(5,6,13,.98) 58%,rgba(32,8,18,.94));box-shadow:0 28px 80px var(--shadow),inset 0 0 80px rgba(255,43,61,.08)}
.cover:before{content:'01101100 01101001 01100111 01101000 01110100 01110011';position:absolute;left:24px;right:24px;bottom:18px;color:rgba(50,216,255,.16);font-family:Roboto Slab,serif;font-size:12px;letter-spacing:4px;white-space:nowrap;overflow:hidden}.cover:after{content:'HAWKINS';position:absolute;top:18px;right:22px;color:rgba(255,255,255,.07);font-family:Bebas Neue,sans-serif;font-size:86px;letter-spacing:8px;line-height:1}
.label,.smallcap,.rank,.mtype,.mbar,.pill,.tag{font-family:Bebas Neue,Inter,sans-serif;text-transform:uppercase;letter-spacing:2.2px}.label{color:var(--cyan);font-size:18px;text-shadow:0 0 18px rgba(50,216,255,.55)}.label p,.subtitle p,.intro p,.smallcap p,.rank p,.name p,.desc p{margin:0}
h1{font-family:Bebas Neue,Inter,sans-serif;font-size:clamp(62px,13vw,132px);line-height:.86;margin:18px 0 12px;color:#fff;letter-spacing:3px;text-transform:uppercase;text-shadow:0 0 8px #fff,0 0 24px var(--red),0 0 58px var(--red2),0 8px 0 #21040a}.subtitle{font-weight:800;color:var(--amber);font-size:clamp(15px,2.5vw,21px);text-transform:uppercase;letter-spacing:2px}.intro{max-width:780px;margin-top:24px;color:var(--soft);font-family:Roboto Slab,Georgia,serif;font-size:18px;background:rgba(5,6,13,.55);border:1px solid rgba(255,255,255,.08);padding:18px 22px;box-shadow:0 14px 34px rgba(0,0,0,.28)}
.tags{margin-top:24px}.tags p,.stats p{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0}.tag,.pill{display:inline-flex;align-items:center;border:1px solid rgba(50,216,255,.34);background:rgba(50,216,255,.08);color:#dff9ff;border-radius:999px;padding:5px 10px;font-size:14px;line-height:1}.tag{border-color:rgba(255,43,61,.42);background:rgba(255,43,61,.10);color:#ffdbe0}
.sh{text-align:center;margin:54px 0 20px}.sh h2{font-family:Bebas Neue,Inter,sans-serif;font-size:clamp(34px,7vw,62px);letter-spacing:2px;line-height:.95;color:#fff;text-transform:uppercase;text-shadow:0 0 20px rgba(50,216,255,.45)}.smallcap{color:var(--red);font-size:17px}.rule{border:0;height:2px;max-width:560px;margin:0 auto 28px;background:linear-gradient(90deg,transparent,var(--cyan),var(--red),var(--cyan),transparent);box-shadow:0 0 18px rgba(255,43,61,.5)}
.grid,.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card,.panel,.mission,.villain,.ending{border:1px solid var(--line);background:linear-gradient(160deg,rgba(23,31,51,.96),rgba(9,12,24,.98));box-shadow:0 18px 48px rgba(0,0,0,.34)}.card{position:relative;padding:22px;border-top:3px solid var(--red)}.card:after{content:'';position:absolute;inset:auto 0 0;height:3px;background:linear-gradient(90deg,var(--red),var(--cyan));opacity:.9}.rank{color:var(--cyan);font-size:15px}.name{font-family:Bebas Neue,Inter,sans-serif;color:#fff;font-size:34px;letter-spacing:1px;line-height:1;margin:4px 0 10px}.desc{color:var(--muted);font-family:Roboto Slab,Georgia,serif;font-size:15px}.stats{margin-top:16px}.stats p{justify-content:flex-start}
.art{display:block;width:100%;height:clamp(230px,36vw,390px);object-fit:cover;margin:22px 0;border:1px solid rgba(120,150,210,.28);background:#05060d;box-shadow:0 20px 50px rgba(0,0,0,.28);filter:saturate(.86) contrast(1.08) brightness(.82)}.art.compact{height:clamp(190px,28vw,320px);margin:14px 0}.art-card{padding:0;overflow:hidden}.art-card p{margin:0}.art-card img{display:block;width:100%}.scene-art{margin:22px 0;border:1px solid rgba(120,150,210,.28);background:#05060d;box-shadow:0 20px 50px rgba(0,0,0,.28);overflow:hidden}.scene-art figure{margin:0}.scene-art figcaption{padding:7px 12px;font-family:Bebas Neue,Inter,sans-serif;text-transform:uppercase;letter-spacing:2px;font-size:15px;color:var(--muted);background:rgba(5,6,13,.68)}.scene-art img{display:block;width:100%;max-height:430px;object-fit:cover;filter:saturate(.88) contrast(1.06) brightness(.86)}.scene-art.setup img{max-height:none;object-fit:contain;background:#05060d}
.portrait{display:block;width:100%;height:230px;object-fit:cover;object-position:top center;margin:4px 0 14px;border:1px solid rgba(255,43,61,.28);background:#05060d;filter:saturate(.92) contrast(1.05)}.box p:has(.portrait){margin:0}
.panel{padding:26px;margin:26px 0}.panel h3,.rtitle{font-family:Bebas Neue,Inter,sans-serif;color:#fff;text-transform:uppercase;letter-spacing:2px;font-size:30px;line-height:1;margin:0 0 16px;text-shadow:0 0 18px rgba(255,43,61,.42)}.panel h3:before,.rtitle:before{content:'▣ ';color:var(--red)}.box{border:1px solid rgba(120,150,210,.22);background:rgba(5,9,18,.58);padding:16px}.box h4{font-family:Bebas Neue,Inter,sans-serif;color:var(--amber);font-size:22px;letter-spacing:1.5px;margin:0 0 8px;text-transform:uppercase}.box ul,.rbox ul{margin:0;padding:0;list-style:none}.box li,.rbox li{position:relative;padding:7px 0 7px 20px;color:var(--soft);border-bottom:1px solid rgba(120,150,210,.12)}.box li:last-child,.rbox li:last-child{border-bottom:0}.box li:before,.rbox li:before{content:'>';position:absolute;left:0;color:var(--cyan);font-weight:800}.box strong,.rbox strong{color:#fff}.scale{border-left:4px solid var(--cyan)!important}.print{border-left:4px solid var(--red)!important}.ai{border-left:4px solid var(--amber)!important}
.chapter{margin:60px 0}.banner{position:relative;overflow:hidden;padding:30px 26px;margin-bottom:22px;border:1px solid rgba(50,216,255,.32);background:radial-gradient(circle at 88% 30%,rgba(50,216,255,.14),transparent 36%),linear-gradient(135deg,rgba(18,35,64,.9),rgba(5,6,13,.6))}.banner:after{content:'RUN';position:absolute;right:18px;bottom:-22px;font-family:Bebas Neue,sans-serif;font-size:118px;line-height:1;color:rgba(50,216,255,.08)}.banner.red{border-color:rgba(255,43,61,.38);background:radial-gradient(circle at 88% 30%,rgba(255,43,61,.18),transparent 36%),linear-gradient(135deg,rgba(58,10,23,.88),rgba(5,6,13,.62))}.banner.red:after{content:'LAB';color:rgba(255,43,61,.09)}.banner.violet{border-color:rgba(130,100,255,.42);background:radial-gradient(circle at 88% 30%,rgba(130,100,255,.20),transparent 36%),linear-gradient(135deg,rgba(34,22,68,.88),rgba(5,6,13,.7))}.banner.violet:after{content:'VOID';color:rgba(130,100,255,.10)}.ctitle{font-family:Bebas Neue,Inter,sans-serif;color:#fff;font-size:clamp(40px,8vw,72px);line-height:.95;letter-spacing:2px;text-shadow:0 0 22px rgba(255,43,61,.45)}
.mission{margin:24px 0 34px;overflow:hidden}.mhead{display:flex;background:linear-gradient(90deg,rgba(255,43,61,.18),rgba(50,216,255,.06))}.mbar{width:54px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;padding:12px 0;background:linear-gradient(180deg,var(--red2),rgba(50,216,255,.28));color:#fff;font-size:15px;border-right:1px solid rgba(255,255,255,.1)}.mhc{flex:1;padding:18px 20px;border-bottom:1px solid rgba(120,150,210,.18)}.mtype{color:var(--cyan);font-size:15px}.mtitle{font-family:Bebas Neue,Inter,sans-serif;color:#fff;font-size:38px;line-height:1;letter-spacing:1px}.mbody{padding:22px}.quote{position:relative;margin:0 0 18px;padding:16px 18px 16px 22px;color:#fff;background:linear-gradient(90deg,rgba(255,43,61,.16),rgba(50,216,255,.06));border-left:4px solid var(--red);font-family:Roboto Slab,Georgia,serif;font-size:16px}.quote cite{display:block;margin-top:10px;color:var(--cyan);font-family:Bebas Neue,Inter,sans-serif;font-style:normal;font-size:16px;letter-spacing:2px;text-transform:uppercase}.rbox{border:1px solid rgba(255,43,61,.34);background:rgba(6,8,18,.78);padding:18px;margin-top:16px}.rbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.terrain{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}.terrain .box{border-left:4px solid var(--green)}
.maptop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:9px 14px;background:rgba(5,9,18,.8);border-top:1px solid rgba(120,150,210,.22);border-bottom:1px solid rgba(120,150,210,.22);color:var(--amber);font-family:Bebas Neue,Inter,sans-serif;text-transform:uppercase;letter-spacing:2px;font-size:15px}.map{display:block;width:100%;background:#05060d;border-bottom:1px solid rgba(120,150,210,.22)}
.mission p:has(.map){margin:0}
.villain{position:relative;overflow:hidden;padding:30px;margin:44px 0;border-color:rgba(130,100,255,.42);background:radial-gradient(circle at 85% 18%,rgba(130,100,255,.24),transparent 34%),linear-gradient(135deg,rgba(42,10,38,.82),rgba(6,8,18,.98))}.villain:after{content:'MIND FLAYER';position:absolute;right:16px;top:6px;color:rgba(255,255,255,.06);font-family:Bebas Neue,sans-serif;font-size:76px;letter-spacing:5px}.villain .name{font-size:54px;color:#fff;text-shadow:0 0 18px rgba(130,100,255,.8),0 0 42px rgba(255,43,61,.35)}.villain p{max-width:780px;color:var(--soft)}.ending{text-align:center;padding:34px;margin:42px 0;background:radial-gradient(circle at 50% 0%,rgba(255,43,61,.15),transparent 42%),linear-gradient(160deg,rgba(17,26,48,.9),rgba(6,8,18,.98))}.ending h3{font-family:Bebas Neue,Inter,sans-serif;font-size:46px;letter-spacing:2px;line-height:1;color:#fff;text-shadow:0 0 22px rgba(255,43,61,.5)}
@media print{body{background:#fff;color:#111}.wrap{max-width:none}.cover,.card,.panel,.mission,.villain,.ending{box-shadow:none;break-inside:avoid}.cover{break-after:page}}
@media(max-width:680px){.wrap{padding:12px}.cover{min-height:430px;padding:48px 16px}.cover:after{font-size:54px}.intro{font-size:16px;padding:14px}.mbar{width:40px}.mbody{padding:16px}.panel{padding:18px}.mission{margin-left:-4px;margin-right:-4px}.mtitle{font-size:31px}}
</style>
</head>
<body><main class="wrap">
$body$
</main></body></html>
